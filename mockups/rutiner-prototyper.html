<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Honniscoins · Rutiner-prototyper</title>
<style>
  :root{
    --bg:#000;--surface:#0b1a33;--surface-2:#0f2547;--line:#1c3a63;
    --text:#fff;--muted:#9fb3cf;--accent:#3b6fe0;
    --bronze:#cd7f32;--silver:#cfd6dd;--gold:#ffce3a;--good:#3ddc97;--bad:#ff8080;
    --radius:16px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#050505;color:var(--text);font-family:var(--font);
    -webkit-font-smoothing:antialiased;padding:0 0 40px}
  h1{font-size:1.1rem;margin:0}
  .muted{color:var(--muted)}
  .wrap{max-width:1100px;margin:0 auto;padding:16px}

  /* Kontrollpanel */
  .panel{background:#0b1220;border:1px solid #1c2e4d;border-radius:14px;padding:14px;margin-bottom:18px}
  .panel .lead{font-size:.95rem;font-weight:800;margin-bottom:10px}
  .ctlrow{display:flex;flex-wrap:wrap;gap:18px}
  .ctl{min-width:220px}
  .ctl .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
  .seg{display:inline-flex;background:#0a1526;border:1px solid var(--line);border-radius:11px;overflow:hidden;flex-wrap:wrap}
  .seg button{background:transparent;border:none;color:var(--muted);padding:9px 13px;font-size:.82rem;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--accent);color:#fff}
  .hint{font-size:.78rem;color:var(--muted);margin-top:10px;line-height:1.4}

  /* Telefon-ramme */
  .stage{display:flex;gap:26px;flex-wrap:wrap;justify-content:center}
  .phone{width:390px;max-width:100%;background:var(--bg);border:1px solid #12203a;border-radius:30px;
    padding:14px 12px 0;box-shadow:0 18px 50px rgba(0,0,0,.55);display:flex;flex-direction:column;min-height:720px}
  .brand{display:flex;align-items:center;gap:8px;padding:2px 6px 10px}
  .brand .logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(160deg,#3b6fe0,#173a86);display:flex;align-items:center;justify-content:center}
  .brand b{font-size:.95rem}.brand .bal{margin-left:auto;font-weight:800;color:var(--gold)}
  .screen{flex:1;overflow:auto;padding:2px 4px}
  .caption{font-size:.8rem;color:var(--muted);text-align:center;margin:8px 0 2px}

  /* Seksjoner + kort (matcher appen) */
  .sec{font-size:.82rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin:16px 2px 8px}
  .qbanner{background:rgba(61,220,151,.12);border:1px solid rgba(61,220,151,.4);color:#bff3dc;
    border-radius:12px;padding:9px 12px;font-size:.82rem;margin-bottom:10px}
  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:9px}
  .qcard.done{opacity:.85}.qcard.appr{opacity:.7}
  .qtop{display:flex;align-items:center;gap:8px}
  .qtitle{font-size:.98rem}.qpts{margin-left:auto;font-weight:800;color:var(--gold);font-size:.9rem;white-space:nowrap}
  .qrec{display:inline-block;font-size:.72rem;color:#9ec2ff;background:rgba(59,111,224,.14);
    border:1px solid rgba(59,111,224,.35);border-radius:20px;padding:2px 9px;margin-top:7px}
  .qrec.lead{color:#cbb7ff;background:rgba(140,110,255,.14);border-color:rgba(140,110,255,.35)}
  .subs{list-style:none;margin:10px 0 4px;padding:0}
  .subs li{display:flex;align-items:center;gap:9px;padding:5px 0;font-size:.9rem}
  .subs li.done span{color:var(--muted);text-decoration:line-through}
  .subchk{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:#0a1526;color:var(--good);
    font-weight:900;font-size:.8rem;cursor:pointer;flex:none}
  .subchk.on{background:var(--good);color:#04120b;border-color:var(--good)}
  .subprog{font-size:.76rem;color:var(--muted);margin-top:4px}
  .btnrow{display:flex;gap:8px;margin-top:10px}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:11px;padding:11px;font-weight:800;font-size:.9rem;width:100%;cursor:pointer}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .btn.good{background:var(--good);color:#04120b}
  .btn:disabled{opacity:.45}

  /* Sammenleggbart rutinekort (rhead/rbody-mønster) */
  .rt{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden}
  .rt.done{border-color:rgba(61,220,151,.35)}
  .rhead{display:flex;align-items:center;gap:10px;padding:12px;cursor:pointer;user-select:none}
  .rhead .rt-ic{font-size:1.05rem}
  .rhead .rt-ttl{font-weight:700;font-size:.96rem}
  .rhead .rt-sum{margin-left:auto;display:flex;align-items:center;gap:9px}
  .pill{font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:20px;background:#0a1526;border:1px solid var(--line);color:var(--muted)}
  .pill.ok{color:#04120b;background:var(--good);border-color:var(--good)}
  .pill.part{color:#ffd98a;border-color:rgba(255,206,58,.4)}
  .rchev{width:34px;height:34px;flex:none;border-radius:50%;background:#0a1526;border:1px solid var(--line);
    color:#cfe0ff;font-size:1.25rem;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:transform .18s}
  .rt.open .rchev{transform:rotate(180deg)}
  .rbody{padding:0 12px 12px}
  .rbody[hidden]{display:none}

  /* Gruppe-header (kollapsbar seksjon) */
  .grp{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);
    border-radius:14px;margin:16px 0 10px;overflow:hidden}
  .grphead{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;user-select:none}
  .grphead .g-ic{font-size:1.1rem}
  .grphead b{font-size:.98rem}
  .grphead .g-sum{margin-left:auto;display:flex;align-items:center;gap:9px}
  .grp.open .rchev{transform:rotate(180deg)}
  .grphead .rchev{color:#cfe0ff}
  .grpbody{padding:2px 12px 12px}
  .grpbody[hidden]{display:none}
  .progbar{height:6px;border-radius:6px;background:#0a1526;border:1px solid var(--line);overflow:hidden;margin:2px 2px 0}
  .progbar i{display:block;height:100%;background:var(--good)}

  .empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:.85rem}

  /* Bunn-nav */
  .nav{display:flex;border-top:1px solid #12203a;margin-top:6px}
  .nav button{flex:1;background:transparent;border:none;color:var(--muted);padding:9px 0 12px;font-size:.66rem;cursor:pointer;position:relative}
  .nav button.on{color:#fff}
  .nav .ic{font-size:1.25rem;display:block;margin-bottom:2px}
  .nav .nbadge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--bad);color:#210000;
    font-size:.6rem;font-weight:900;min-width:16px;height:16px;border-radius:9px;padding:0 3px;line-height:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Honniscoins · Rutiner-prototyper for sønn</h1>
  <p class="muted" style="margin:6px 0 16px;font-size:.88rem">
    Klikk på rutinene for å utvide/kollapse. Bytt variant og kollaps-oppførsel i panelet — telefonene under oppdateres.
  </p>

  <div class="panel">
    <div class="lead">Slå på/av og sammenlign</div>
    <div class="ctlrow">
      <div class="ctl">
        <div class="lbl">Plassering</div>
        <div class="seg" id="segVariant">
          <button data-v="tab" class="on">🔁 Egen fane</button>
          <button data-v="section">Egen seksjon</button>
          <button data-v="cards">Blandede kort</button>
        </div>
      </div>
      <div class="ctl">
        <div class="lbl">Kollaps-oppførsel</div>
        <div class="seg" id="segCollapse">
          <button data-c="collapsed" class="on">Kollapset</button>
          <button data-c="smart">Smart</button>
          <button data-c="open">Alt utvidet</button>
        </div>
      </div>
    </div>
    <div class="hint" id="hint"></div>
  </div>

  <div class="stage" id="stage"></div>
</div>

<script>
// ---- Prøvedata (som sønnen ville sett en tirsdag) --------------------------
function seed(){
  return {
    routines:[
      {id:'r1', title:'Pakk sekken', points:5, subs:[
        {t:'Matboks',done:false},{t:'Drikkeflaske',done:false},{t:'Bøker',done:false}]},
      {id:'r2', title:'Pakk matbagen', points:5, subs:[
        {t:'Brødskiver',done:true},{t:'Frukt',done:true}]},
      {id:'r3', title:'Pakk gymbagen', points:5, subs:[
        {t:'Gymtøy',done:true},{t:'Sko',done:false}]},
    ],
    tomorrow:[
      {id:'t1', title:'Pakk sekken (i morgen)', points:5, subs:[
        {t:'Matboks',done:false},{t:'Bøker',done:false}]},
    ],
    quests:[
      {id:'q1', title:'Rydde rommet', points:10, desc:'Alt på plass og støvsugd.'},
      {id:'q2', title:'Vanne blomstene', points:4, desc:''},
    ],
  };
}
const DATA = seed();

const UI = { variant:'tab', collapse:'collapsed', open:{}, page:'rutiner' };
// open[id] = eksplisitt bruker-toggle (overstyrer default)

const rDone = r => r.subs.filter(s=>s.done).length;
const rTotal = r => r.subs.length;
const rReady = r => rDone(r)===rTotal(r);

// Skal kroppen vises? default avhenger av collapse-modus, bruker-toggle overstyrer.
function isOpen(r){
  if(r.id in UI.open) return UI.open[r.id];
  if(UI.collapse==='open') return true;
  if(UI.collapse==='collapsed') return false;
  // smart: utvid uferdige, kollaps ferdige
  return !rReady(r);
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---- Byggeklosser ----------------------------------------------------------
function routineCard(r, {tomorrow=false}={}){
  const done=rDone(r), tot=rTotal(r), ready=rReady(r), op=isOpen(r);
  const pill = ready ? `<span class="pill ok">✓ ferdig</span>`
    : `<span class="pill ${done>0?'part':''}">${done}/${tot}</span>`;
  const badge = tomorrow
    ? `<span class="qrec lead" style="margin:0">🌙 for i morgen</span>`
    : '';
  const subs = r.subs.map((s,i)=>`
    <li class="${s.done?'done':''}">
      <button class="subchk ${s.done?'on':''}" data-sub="${r.id}|${i}">${s.done?'✓':''}</button>
      <span>${esc(s.t)}</span>
    </li>`).join('');
  return `<div class="rt ${op?'open':''} ${ready?'done':''}">
    <div class="rhead" data-toggle="${r.id}">
      <span class="rt-ic">🔁</span>
      <span class="rt-ttl">${esc(r.title)}</span>
      <span class="rt-sum">${badge} ${pill}<span class="rchev">▾</span></span>
    </div>
    <div class="rbody" ${op?'':'hidden'}>
      <ul class="subs">${subs}</ul>
      <div class="subprog">${done} av ${tot} gjort</div>
      <button class="btn good" ${ready?'':'disabled'}>${ready?'🔒 Marker som ferdig':'Huk av alle først'}</button>
    </div>
  </div>`;
}

function questCard(q){
  return `<div class="qcard">
    <div class="qtop"><b class="qtitle">${esc(q.title)}</b><span class="qpts">+${q.points} 💰</span></div>
    ${q.desc?`<div class="muted" style="font-size:.85rem;margin-top:6px">${esc(q.desc)}</div>`:''}
    <div class="btnrow"><button class="btn">🔒 Marker som ferdig</button></div>
  </div>`;
}

function routinesSummary(){
  const total=DATA.routines.length, ferdig=DATA.routines.filter(rReady).length;
  const pct=Math.round(ferdig/total*100);
  return {total, ferdig, igjen:total-ferdig, pct};
}

// ---- Varianter -------------------------------------------------------------
function routineList(){
  return DATA.routines.map(r=>routineCard(r)).join('')
    + DATA.tomorrow.map(r=>routineCard(r,{tomorrow:true})).join('');
}

function viewRutinerPage(){ // for egen-fane-varianten
  const s=routinesSummary();
  return `
    <div class="sec">Dagens rutiner</div>
    <div class="muted" style="font-size:.85rem;margin:0 2px 8px">${s.igjen? `${s.igjen} av ${s.total} igjen`:'Alt ferdig i dag! 🎉'}</div>
    <div class="progbar"><i style="width:${s.pct}%"></i></div>
    <div style="margin-top:12px">${routineList()}</div>`;
}

function viewSidequestsOnly(){
  return `<div class="sec">Å gjøre (${DATA.quests.length})</div>${DATA.quests.map(questCard).join('')}`;
}

function viewSection(){ // egen kollapsbar gruppe + oppdrag
  const s=routinesSummary();
  const grpOpen = ('grp' in UI.open)? UI.open.grp : (UI.collapse!=='collapsed');
  const pill = s.igjen? `<span class="pill part">${s.ferdig}/${s.total} ✓</span>`
    : `<span class="pill ok">✓ alle</span>`;
  return `
    <div class="grp ${grpOpen?'open':''}">
      <div class="grphead" data-toggle="grp">
        <span class="g-ic">🔁</span><b>Dagens rutiner</b>
        <span class="g-sum">${pill}<span class="rchev">▾</span></span>
      </div>
      <div class="grpbody" ${grpOpen?'':'hidden'}>
        <div class="progbar" style="margin-bottom:10px"><i style="width:${s.pct}%"></i></div>
        ${routineList()}
      </div>
    </div>
    <div class="sec">⭐ Oppdrag (${DATA.quests.length})</div>
    ${DATA.quests.map(questCard).join('')}`;
}

function viewCards(){ // blandet, men rutiner er sammenleggbare kort
  return `<div class="sec">Å gjøre (${DATA.routines.length+DATA.quests.length})</div>
    ${routineList()}
    ${DATA.quests.map(questCard).join('')}`;
}

// ---- Render ----------------------------------------------------------------
function nav(active){
  const pages = UI.variant==='tab'
    ? [['uken','📅','Uken'],['poeng','💵','Poeng'],['sidequests','⭐','Oppdrag'],['rutiner','🔁','Rutiner'],['shop','🛒','Shop']]
    : [['uken','📅','Uken'],['poeng','💵','Poeng'],['sidequests','⭐','Sidequests'],['shop','🛒','Shop']];
  const igjen = routinesSummary().igjen;
  return `<div class="nav">${pages.map(([k,ic,l])=>{
    const badge = (k==='rutiner' && igjen) ? `<span class="nbadge">${igjen}</span>` : '';
    return `<button class="${k===active?'on':''}" data-page="${k}">
      <span class="ic">${ic}${badge}</span>${l}</button>`;
  }).join('')}</div>`;
}

function phone(title, bodyHtml, activePage){
  return `<div class="phone">
    <div class="brand"><div class="logo">🪙</div><b>Honniscoins</b><span class="bal">142 💰</span></div>
    <div class="screen">${bodyHtml}</div>
    ${nav(activePage)}
  </div>`;
}

function render(){
  const stage=document.getElementById('stage');
  let html='';
  if(UI.variant==='tab'){
    // to telefoner: Rutiner-fanen + Sidequests-fanen (ren)
    html = `<div>
        <div class="caption">🔁 Rutiner-fanen (ny)</div>
        ${phone('Rutiner', viewRutinerPage(), 'rutiner')}
      </div>
      <div>
        <div class="caption">⭐ Sidequests-fanen (kun oppdrag)</div>
        ${phone('Sidequests', viewSidequestsOnly(), 'sidequests')}
      </div>`;
  } else if(UI.variant==='section'){
    html = `<div>
        <div class="caption">⭐ Sidequests-siden med rutine-gruppe</div>
        ${phone('Sidequests', viewSection(), 'sidequests')}
      </div>`;
  } else {
    html = `<div>
        <div class="caption">⭐ Sidequests-siden, sammenleggbare rutinekort blandet inn</div>
        ${phone('Sidequests', viewCards(), 'sidequests')}
      </div>`;
  }
  stage.innerHTML = html;
  bind(stage);
  updateHint();
}

function bind(root){
  root.querySelectorAll('[data-toggle]').forEach(h=>h.onclick=()=>{
    const id=h.dataset.toggle;
    const cur = (id in UI.open)? UI.open[id]
      : (id==='grp' ? (UI.collapse!=='collapsed')
         : (UI.collapse==='open' || (UI.collapse==='smart' && !rReady(DATA.routines.find(r=>r.id===id)||{subs:[]}))));
    UI.open[id]=!cur;
    render();
  });
  root.querySelectorAll('[data-sub]').forEach(b=>b.onclick=(e)=>{
    e.stopPropagation();
    const [rid,i]=b.dataset.sub.split('|');
    const r=DATA.routines.find(x=>x.id===rid);
    if(r){ r.subs[i].done=!r.subs[i].done; render(); }
  });
  root.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{ /* demo: ingen ekte navigasjon */ });
}

const HINTS={
  tab:'Egen bunn-fane 🔁 med badge = antall rutiner igjen. Sidequests-fanen blir ren og kort. Sterkest adskillelse, men navet får 5 faner.',
  section:'Én side. Rutiner samlet i én kollapsbar «Dagens rutiner»-gruppe over oppdragene. Ingen ny fane; hele gruppen kan lukkes når alt er gjort.',
  cards:'Minst inngrep: rutiner ligger blandet i «Å gjøre», men hvert kort kollapser til én progress-linje. Løser deloppgave-veggen, men rutiner/oppdrag er fortsatt visuelt like.',
};
const CHINTS={
  collapsed:' · Kollaps-standard: alt lukket — sønnen ser kun tittel + X/Y og utvider selv.',
  smart:' · Kollaps-standard: uferdige åpne, ferdige lukkes automatisk.',
  open:' · Kollaps-standard: alt åpent (som i dag), kun gruppert.',
};
function updateHint(){ document.getElementById('hint').textContent = HINTS[UI.variant]+CHINTS[UI.collapse]; }

document.getElementById('segVariant').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  UI.variant=b.dataset.v; UI.open={};
  document.querySelectorAll('#segVariant button').forEach(x=>x.classList.toggle('on',x===b));
  render();
};
document.getElementById('segCollapse').onclick=e=>{
  const b=e.target.closest('button'); if(!b)return;
  UI.collapse=b.dataset.c; UI.open={};
  document.querySelectorAll('#segCollapse button').forEach(x=>x.classList.toggle('on',x===b));
  render();
};

render();
</script>
</body>
</html>
