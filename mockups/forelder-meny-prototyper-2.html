<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Honniscoins · Forelder-meny · topp-menyer</title>
<style>
  :root{
    --bg:#000;--surface:#0b1a33;--surface-2:#0f2547;--line:#1c3a63;--text:#fff;
    --muted:#9fb3cf;--accent:#3b6fe0;--gold:#ffce3a;--good:#3ddc97;--bad:#ff8080;
    --radius:14px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#05060a;color:var(--text);font-family:var(--font);padding:24px;line-height:1.4}
  h1{font-size:1.4rem;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 20px;font-size:.9rem;max-width:680px}
  .wrap{display:flex;gap:32px;flex-wrap:wrap;align-items:flex-start}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;min-width:280px}
  .panel h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 10px}
  .opt{display:block;width:100%;text-align:left;background:var(--surface-2);border:1px solid var(--line);
       border-radius:12px;padding:12px 14px;margin-bottom:10px;color:var(--text);cursor:pointer;font-family:var(--font)}
  .opt.on{border-color:var(--accent);background:linear-gradient(160deg,#12294e,var(--surface-2))}
  .opt b{display:block;font-size:.95rem}
  .opt small{color:var(--muted);font-size:.76rem}
  .plusminus{margin-top:6px;font-size:.72rem;color:var(--muted);white-space:pre-line}

  .phone{width:340px;background:#000;border:10px solid #14161c;border-radius:38px;overflow:hidden;
         box-shadow:0 20px 60px rgba(0,0,0,.6);flex:none}
  .screen{height:660px;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
  .brand{display:flex;align-items:center;gap:8px;padding:12px 16px 6px}
  .brand .logo{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#6a27b8);
               display:flex;align-items:center;justify-content:center;font-size:.95rem}
  .brand b{font-size:.98rem}.brand .bal{color:var(--gold);font-weight:800;margin-left:auto;font-size:.9rem}
  .content{flex:1;overflow:auto;padding:14px 16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:10px}
  .card b{font-size:1.05rem}.card p{color:var(--muted);font-size:.85rem;margin:6px 0 0}
  .sectitle{font-size:1.15rem;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .navbadge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:16px;padding:0 4px;
            border-radius:9px;background:var(--accent);color:#fff;font-size:.6rem;font-weight:800;margin-left:4px}
  .backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:8}
  .backdrop.show{opacity:1;pointer-events:auto}

  /* E · Seksjonsvelger (stor dropdown-knapp) */
  .selbar{padding:6px 16px 12px}
  .selbtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--surface);border:1px solid var(--line);
          border-radius:13px;padding:13px 16px;color:#fff;font-family:var(--font);font-size:1.05rem;font-weight:800;cursor:pointer}
  .selbtn .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
  .selbtn.open .chev{transform:rotate(180deg)}
  .dropdown{position:absolute;left:16px;right:16px;background:var(--surface);border:1px solid var(--line);
            border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.55);z-index:9;overflow:hidden;
            transform-origin:top;transform:scaleY(.6);opacity:0;pointer-events:none;transition:.16s}
  .dropdown.show{transform:scaleY(1);opacity:1;pointer-events:auto}
  .mitem{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;color:var(--text);
         font-family:var(--font);font-size:1rem;padding:12px 16px;cursor:pointer;text-align:left;border-bottom:1px solid #0c1c33}
  .mitem:last-child{border-bottom:none}
  .mitem:hover{background:var(--surface-2)}
  .mitem .mi{font-size:1.2rem;width:24px;text-align:center}
  .mitem.on{color:var(--accent);font-weight:800;background:var(--surface-2)}

  /* F · Faste tabs + ▾ dropdown til høyre */
  .toprow{display:flex;align-items:stretch;gap:6px;padding:4px 12px 12px;border-bottom:1px solid var(--line)}
  .tt{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;color:var(--muted);
      font-family:var(--font);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
  .tt .i{font-size:1.15rem}.tt .l{font-size:.6rem;font-weight:700}
  .tt.on{color:#fff;border-color:var(--accent);background:linear-gradient(160deg,#12294e,var(--surface))}
  .more{flex:0 0 46px;background:var(--surface);border:1px solid var(--line);border-radius:11px;color:#fff;font-size:1.1rem;cursor:pointer}
  .more.on{border-color:var(--accent)}
  .dropright{position:absolute;right:12px;top:98px;width:190px;background:var(--surface);border:1px solid var(--line);
             border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.55);z-index:9;overflow:hidden;
             transform-origin:top right;transform:scale(.7);opacity:0;pointer-events:none;transition:.16s}
  .dropright.show{transform:scale(1);opacity:1;pointer-events:auto}

  /* G · Grid-meny (fullskjerm-overlay) */
  .apptop{display:flex;align-items:center;gap:12px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
  .menubtn{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
           border-radius:11px;color:#fff;font-family:var(--font);font-weight:800;padding:9px 14px;cursor:pointer;font-size:.95rem}
  .apptop .now{margin-left:auto;font-weight:800;color:var(--accent)}
  .gridwrap{position:absolute;inset:0;background:rgba(4,8,16,.97);z-index:9;padding:18px;
            opacity:0;pointer-events:none;transition:.18s;overflow:auto}
  .gridwrap.show{opacity:1;pointer-events:auto}
  .gridwrap .gh{display:flex;align-items:center;margin-bottom:14px}
  .gridwrap .gh b{font-size:1.1rem}.gridwrap .gh .x{margin-left:auto;font-size:1.4rem;cursor:pointer;color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 8px;cursor:pointer;
        display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
  .tile .ti{font-size:1.7rem}.tile .tl{font-size:.78rem;font-weight:700;color:var(--muted)}
  .tile.on{border-color:var(--accent);background:linear-gradient(160deg,#12294e,var(--surface))}
  .tile.on .tl{color:#fff}
  .tile .navbadge{position:absolute;top:10px;right:12px;margin:0}

  /* H · To rader (gruppe + undertabs) øverst */
  .grouprow{display:flex;gap:6px;padding:6px 12px}
  .g{flex:1;background:none;border:none;color:var(--muted);font-family:var(--font);padding:6px 2px;cursor:pointer;
     display:flex;flex-direction:column;align-items:center;gap:2px;border-bottom:2px solid transparent}
  .g .gi{font-size:1.15rem}.g .gl{font-size:.62rem;font-weight:800}
  .g.on{color:#fff;border-bottom-color:var(--accent)}.g.on .gl{color:var(--accent)}
  .subrow{display:flex;gap:8px;padding:4px 12px 12px;overflow-x:auto;border-bottom:1px solid var(--line)}
  .spill{flex:none;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:7px 14px;
         color:var(--muted);font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
  .spill.on{color:#fff;border-color:var(--accent);background:linear-gradient(160deg,#12294e,var(--surface-2))}

  /* I · Megameny-dropdown (grupperte kolonner) */
  .megabtn{display:flex;align-items:center;gap:8px;width:100%;background:var(--surface);border:1px solid var(--line);
           border-radius:13px;padding:12px 16px;margin:6px 16px 12px;width:calc(100% - 32px);
           color:#fff;font-family:var(--font);font-size:1.02rem;font-weight:800;cursor:pointer}
  .megabtn .chev{margin-left:auto;color:var(--muted);transition:transform .2s}
  .megabtn.open .chev{transform:rotate(180deg)}
  .mega{position:absolute;left:16px;right:16px;background:var(--surface);border:1px solid var(--line);
        border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.55);z-index:9;padding:12px;
        transform-origin:top;transform:scaleY(.6);opacity:0;pointer-events:none;transition:.16s}
  .mega.show{transform:scaleY(1);opacity:1;pointer-events:auto}
  .mega .mh{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin:10px 8px 6px}
  .mega .mh:first-child{margin-top:2px}
  .mchips{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
  .mchip{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 12px;
         color:var(--text);font-family:var(--font);font-size:.86rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
  .mchip.on{border-color:var(--accent);color:var(--accent)}
</style>
</head>
<body>
<h1>Forelder-meny · topp-menyer (runde 2)</h1>
<p class="lead">Fem nye forslag, alle montert <b>øverst</b> — nedtrekk og lignende. Rutiner er eget punkt. Velg variant og klikk rundt i telefonen.</p>

<div class="wrap">
  <div class="panel">
    <h2>Variant</h2>
    <button class="opt on" data-v="sel">
      <b>E · Seksjonsvelger</b>
      <small>Én stor knapp «📝 Dag ▾» øverst → nedtrekk med alle 9.</small>
      <span class="plusminus">+ Veldig ryddig, tydelig hvor du er\n− Alltid ett trykk for å bytte</span>
    </button>
    <button class="opt" data-v="fixed">
      <b>F · Faste tabs + ▾</b>
      <small>4 faste faner øverst + ▾-knapp som åpner resten i nedtrekk til høyre.</small>
      <span class="plusminus">+ Rask til de vanlige, resten et trykk unna\n− To mekanismer i samme rad</span>
    </button>
    <button class="opt" data-v="grid">
      <b>G · Grid-meny</b>
      <small>«☰ Meny» → fullskjerm rutenett med store ikon-fliser.</small>
      <span class="plusminus">+ Lekent, store trykkmål, oversikt\n− Dekker innholdet mens åpen</span>
    </button>
    <button class="opt" data-v="tworow">
      <b>H · To rader (gruppert)</b>
      <small>Gruppe-rad øverst + kontekst-piller rett under. Alt synlig, ingen nedtrekk.</small>
      <span class="plusminus">+ Ingen skjulte trykk, alt oppe\n− Tar to linjer på toppen</span>
    </button>
    <button class="opt" data-v="mega">
      <b>I · Megameny</b>
      <small>«Meny ▾» → ett stort nedtrekk med grupper (Hjem / Oppgaver / Innsikt / Innstillinger).</small>
      <span class="plusminus">+ Alt på ett sted, logisk sortert\n− Større panel som dekker toppen</span>
    </button>
  </div>

  <div class="phone"><div class="screen" id="screen"></div></div>
</div>

<script>
const SECTIONS = [
  {k:'uke',   ic:'📅', l:'Uke'},
  {k:'dag',   ic:'📝', l:'Dag'},
  {k:'plan',  ic:'🗓', l:'Plan'},
  {k:'quests',ic:'⭐', l:'Quests', badge:3},
  {k:'rutiner',ic:'🔁',l:'Rutiner'},
  {k:'shop',  ic:'🛒', l:'Shop',   badge:1},
  {k:'logg',  ic:'📋', l:'Logg'},
  {k:'stat',  ic:'📊', l:'Stat'},
  {k:'poeng', ic:'⚙️', l:'Settings'},
];
const byKey = k => SECTIONS.find(s=>s.k===k);
const GROUPS = [
  {k:'hjem',   ic:'🏠', l:'Hjem',    items:['uke','dag','plan']},
  {k:'oppg',   ic:'⭐', l:'Oppgaver',items:['quests','rutiner','shop']},
  {k:'innsikt',ic:'📊', l:'Innsikt', items:['logg','stat']},
  {k:'sett',   ic:'⚙️', l:'Innst.',  items:['poeng']},
];
const badge = s => s.badge ? `<span class="navbadge">${s.badge}</span>` : '';
const UI = { variant:'sel', tab:'dag', open:false, group:'hjem', groupTab:'dag' };
const screen = document.getElementById('screen');

function brand(){ return `<div class="brand"><span class="logo">🪙</span><b>Honniscoins</b><span class="bal">128 💰</span></div>`; }
function content(k){
  const s = byKey(k);
  return `<div class="content">
    <div class="sectitle">${s.ic} ${s.l}</div>
    <div class="card"><b>${s.l}-innhold</b><p>Dummy-flate. «${s.l}» ville vist sitt vanlige innhold her. Rutiner er nå eget punkt.</p></div>
    <div class="card"><b>Eksempelrad</b><p>Innholdet skifter når du velger en annen seksjon.</p></div>
  </div>`;
}
function render(){({sel:E,fixed:F,grid:G,tworow:H,mega:I})[UI.variant]();}

/* E · Seksjonsvelger */
function E(){
  const s=byKey(UI.tab);
  const list=SECTIONS.map(x=>`<button class="mitem ${UI.tab===x.k?'on':''}" data-tab="${x.k}">
    <span class="mi">${x.ic}</span>${x.l}${badge(x)}</button>`).join('');
  screen.innerHTML=`${brand()}
    <div class="selbar"><button class="selbtn ${UI.open?'open':''}" data-toggle>
      <span>${s.ic}</span><span>${s.l}</span><span class="chev">▾</span></button></div>
    ${content(UI.tab)}
    <div class="backdrop ${UI.open?'show':''}" data-close></div>
    <div class="dropdown ${UI.open?'show':''}" style="top:96px">${list}</div>`;
  wireToggle(); wireClose(); wireTabs();
}

/* F · Faste tabs + dropdown */
function F(){
  const primary=['uke','dag','quests','rutiner'];
  const rest=SECTIONS.filter(s=>!primary.includes(s.k));
  const restActive=rest.some(s=>s.k===UI.tab);
  const tabs=primary.map(k=>{const s=byKey(k);
    return `<button class="tt ${UI.tab===k?'on':''}" data-tab="${k}"><span class="i">${s.ic}${badge(s)}</span><span class="l">${s.l}</span></button>`;}).join('');
  const list=rest.map(x=>`<button class="mitem ${UI.tab===x.k?'on':''}" data-tab="${x.k}">
    <span class="mi">${x.ic}</span>${x.l}${badge(x)}</button>`).join('');
  screen.innerHTML=`${brand()}
    <div class="toprow">${tabs}<button class="more ${UI.open||restActive?'on':''}" data-toggle>▾</button></div>
    ${content(UI.tab)}
    <div class="backdrop ${UI.open?'show':''}" data-close></div>
    <div class="dropright ${UI.open?'show':''}">${list}</div>`;
  wireToggle(); wireClose(); wireTabs();
}

/* G · Grid-meny */
function G(){
  const s=byKey(UI.tab);
  const tiles=SECTIONS.map(x=>`<button class="tile ${UI.tab===x.k?'on':''}" data-tab="${x.k}">
    ${badge(x)}<span class="ti">${x.ic}</span><span class="tl">${x.l}</span></button>`).join('');
  screen.innerHTML=`
    <div class="apptop"><button class="menubtn" data-toggle>☰ Meny</button><span class="now">${s.ic} ${s.l}</span></div>
    ${content(UI.tab)}
    <div class="gridwrap ${UI.open?'show':''}">
      <div class="gh"><b>Gå til…</b><span class="x" data-close>✕</span></div>
      <div class="grid">${tiles}</div></div>`;
  wireToggle();
  const x=screen.querySelector('[data-close]'); if(x) x.onclick=()=>{UI.open=false;render();};
  wireTabs();
}

/* H · To rader gruppert */
function H(){
  const grp=GROUPS.find(g=>g.k===UI.group)||GROUPS[0];
  const bar=GROUPS.map(g=>`<button class="g ${UI.group===g.k?'on':''}" data-grp="${g.k}">
    <span class="gi">${g.ic}</span><span class="gl">${g.l}</span></button>`).join('');
  const shown=grp.items.includes(UI.groupTab)?UI.groupTab:grp.items[0];
  const sub=grp.items.length>1
    ? `<div class="subrow">${grp.items.map(k=>{const s=byKey(k);
        return `<button class="spill ${shown===k?'on':''}" data-tab="${k}">${s.ic} ${s.l}${badge(s)}</button>`;}).join('')}</div>`
    : '';
  screen.innerHTML=`${brand()}<div class="grouprow">${bar}</div>${sub}${content(shown)}`;
  screen.querySelectorAll('[data-grp]').forEach(b=>b.onclick=()=>{
    UI.group=b.dataset.grp; UI.groupTab=GROUPS.find(g=>g.k===UI.group).items[0]; render();});
  screen.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{UI.groupTab=b.dataset.tab;render();});
}

/* I · Megameny */
function I(){
  const s=byKey(UI.tab);
  const cols=GROUPS.map(g=>`<div class="mh">${g.ic} ${g.l}</div>
    <div class="mchips">${g.items.map(k=>{const x=byKey(k);
      return `<button class="mchip ${UI.tab===k?'on':''}" data-tab="${k}">${x.ic} ${x.l}${badge(x)}</button>`;}).join('')}</div>`).join('');
  screen.innerHTML=`${brand()}
    <button class="megabtn ${UI.open?'open':''}" data-toggle><span>☰</span><span>Meny · ${s.ic} ${s.l}</span><span class="chev">▾</span></button>
    ${content(UI.tab)}
    <div class="backdrop ${UI.open?'show':''}" data-close></div>
    <div class="mega ${UI.open?'show':''}" style="top:92px">${cols}</div>`;
  wireToggle(); wireClose(); wireTabs();
}

function wireToggle(){const b=screen.querySelector('[data-toggle]'); if(b) b.onclick=()=>{UI.open=!UI.open;render();};}
function wireClose(){const b=screen.querySelector('[data-close]'); if(b) b.onclick=()=>{UI.open=false;render();};}
function wireTabs(){screen.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{UI.tab=b.dataset.tab;UI.open=false;render();});}

document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
  document.querySelectorAll('.opt').forEach(x=>x.classList.remove('on'));
  o.classList.add('on'); UI.variant=o.dataset.v; UI.open=false;
  if(UI.variant==='tworow'){UI.group='hjem';UI.groupTab='dag';}
  render();
});
render();
</script>
</body>
</html>
