<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#050505">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Honniscoins</title>
<style>
  :root{
    --bg:#000;--surface:#0b1a33;--surface-2:#0f2547;--line:#1c3a63;
    --text:#fff;--muted:#9fb3cf;--accent:#3b6fe0;
    --bronze:#cd7f32;--silver:#cfd6dd;--gold:#ffce3a;--good:#3ddc97;--bad:#ff8080;
    --radius:16px;--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0 auto;background:#050505;color:var(--text);font-family:var(--font);
       max-width:480px;padding:12px 16px 40px;min-height:100vh;-webkit-tap-highlight-color:transparent}
  button{font-family:var(--font);cursor:pointer}
  .btn{background:var(--accent);color:#fff;border:none;border-radius:12px;padding:14px;font-weight:700;font-size:1rem;width:100%}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
  .muted{color:var(--muted)}
  .who{display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;min-height:80vh}
  .who .logo{font-size:2.6rem}.who h1{font-size:1.8rem;margin:4px 0 0}
  .role{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);cursor:pointer}
  .role .em{font-size:1.6rem}.role b{display:block;font-size:1.05rem}.role span{color:var(--muted);font-size:.8rem}
  .balance{background:linear-gradient(160deg,var(--surface-2),var(--surface));border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
  .balance .coins{font-size:2rem;font-weight:800;display:flex;align-items:baseline;gap:8px}
  .balance .coins small{font-size:.9rem;font-weight:700;color:var(--muted)}
  .balance .kr{color:var(--muted);font-size:.82rem;margin-top:2px}
  .daynav{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
  .daynav .arrow{width:40px;height:40px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:1.2rem;color:#fff}
  .daynav .today{text-align:center}.daynav .today b{font-size:1.02rem}.daynav .today .d{color:var(--muted);font-size:.75rem}
  .daynav .today input[type=date]{background:transparent;border:none;color:var(--muted);font-family:var(--font);font-size:.75rem}
  .lesson{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid #10233f}
  .lesson .name{flex:1;font-weight:600;font-size:.95rem}
  .medals{display:flex;gap:6px}
  .m{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:1rem;color:#fff;padding:0}
  .m.zero{font-size:.7rem;font-weight:800;color:var(--muted)}
  .m.sel{border-width:2px}
  .m.b.sel{border-color:var(--bronze)}.m.s.sel{border-color:var(--silver)}
  .m.g.sel{border-color:var(--gold)}.m.zero.sel{border-color:var(--bad);color:var(--bad)}
  .daysum{margin-top:14px;color:var(--good);font-weight:700;text-align:center}
  .pinwrap{display:flex;flex-direction:column;align-items:center;gap:18px;min-height:70vh;justify-content:center}
  .pindots{display:flex;gap:14px}.pindot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
  .pindot.on{background:var(--accent);border-color:var(--accent)}
  .keypad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
  .key{height:60px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:1.3rem;font-weight:700;color:#fff}
  .key.blank{background:transparent;border:none}
  .tabbar{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin:8px 0 12px}
  .tabbar .t{flex:1;padding:9px;border-radius:9px;font-size:.8rem;font-weight:700;color:var(--muted);background:transparent;border:none}
  .tabbar .t.on{background:var(--accent);color:#fff}
  .sec{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 2px 8px;font-weight:700}
  .row{display:flex;align-items:center;justify-content:space-between;padding:11px 4px;border-bottom:1px solid #10233f;gap:10px}
  .row .lbl{font-size:.92rem}
  .pill{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:5px 10px;font-weight:700;font-size:.85rem;color:#fff}
  input.inp{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:#fff;font-family:var(--font);width:90px;text-align:right;font-size:1rem}
  input.inp.wide{width:100%;text-align:left}
  .logitem{padding:10px 4px;border-bottom:1px solid #10233f;font-size:.84rem}
  .logitem .meta{color:var(--muted);font-size:.72rem;margin-bottom:2px;display:flex;gap:8px;align-items:center}
  .tag{border-radius:6px;padding:1px 6px;font-size:.66rem;font-weight:700}
  .tag.son{background:#12325e;color:#bcd4ff}.tag.parent{background:#3a2a12;color:#ffd8a0}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .link{background:none;border:none;color:var(--muted);font-size:.8rem;text-decoration:underline}
  #appVersion{color:#3a3a3a;font-size:.68rem;text-align:center;margin-top:24px}

  /* --- sønn: pager --- */
  .brand{display:flex;align-items:center;justify-content:center;gap:8px;margin:2px 0 8px}
  .brand b{font-size:1.15rem}
  .brandbal{font-size:1.1rem;font-weight:800;color:var(--gold)}
  .page{min-height:60vh;padding-bottom:8px}
  .dots{display:flex;gap:7px;justify-content:center;margin:8px 0 6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--line)}
  .dot.on{background:var(--accent)}
  .pagenav{position:sticky;bottom:0;display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;margin-top:2px}
  .pagenav .pg{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:10px;background:transparent;border:none;color:var(--muted)}
  .pagenav .pg .i{font-size:1.25rem;line-height:1}
  .pagenav .pg .l{font-size:.68rem;font-weight:700}
  .pagenav .pg.on{background:var(--accent);color:#fff}

  /* --- sønn: uken --- */
  .weeknav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
  .weeknav .arrow{width:36px;height:36px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:1.1rem;color:#fff}
  .weeknav .wlabel{font-size:.82rem;color:var(--muted);font-weight:700}
  .weekstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
  .weekstrip .wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--text)}
  .weekstrip .wd .n{font-size:.72rem;font-weight:700;color:var(--muted)}
  .weekstrip .wd .b{font-size:.72rem;font-weight:800}
  .weekstrip .wd.locked{border-color:var(--good)}
  .weekstrip .wd.locked .b{color:var(--good)}
  .weekstrip .wd.on{background:var(--accent);border-color:var(--accent)}
  .weekstrip .wd.on .n,.weekstrip .wd.on .b{color:#fff}
  .activeday .ahead{font-size:1.15rem;margin:2px 2px 10px;display:flex;align-items:center;gap:8px}
  .lockchip{font-size:.68rem;background:#0e2a1c;color:var(--good);border:1px solid var(--good);border-radius:8px;padding:2px 7px;font-weight:700}
  .lessonbig{padding:14px 4px}
  .lessonbig .name{font-size:1.05rem}
  .m.fill.big{width:52px;height:52px;font-size:1.5rem;border-radius:14px}
  .m.fill.big.zero{font-size:.9rem}
  .m.fill.b.sel{background:var(--bronze);border-color:var(--bronze);color:#3b2200}
  .m.fill.s.sel{background:var(--silver);border-color:var(--silver);color:#1a2230}
  .m.fill.g.sel{background:var(--gold);border-color:var(--gold);color:#3a2f00}
  .m.fill.zero.sel{background:var(--bad);border-color:var(--bad);color:#3a0000}
  .sickrow{text-align:center;margin-top:10px}
  .sicklink{background:none;border:none;color:var(--muted);font-size:.78rem;text-decoration:underline}
  .sicklink:disabled{opacity:.5}
  .monday{border-color:var(--accent);margin-bottom:14px}

  /* --- sønn: poeng --- */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 6px;text-align:center}
  .stat b{display:block;font-size:1.6rem;font-weight:800}
  .stat span{color:var(--muted);font-size:.66rem;text-transform:uppercase;letter-spacing:.04em;font-weight:700}
  .bonuspt{color:var(--good)}
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;min-height:50vh}
  .empty b{font-size:1.2rem}.empty .muted{max-width:260px}

  /* --- sidequests --- */
  .navbadge{position:absolute;top:-6px;right:-10px;min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--accent);color:#fff;font-size:.62rem;font-weight:800;line-height:16px;text-align:center}
  .pagenav .pg .i{position:relative}
  .tabbar .t{position:relative}
  .qbanner{background:#2a2410;border:1px solid var(--gold);color:var(--gold);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.85rem;text-align:center;margin-bottom:12px}
  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
  .qcard.over{border-color:var(--bad)}
  .qcard.done{border-color:var(--gold);background:linear-gradient(160deg,#241f0e,var(--surface))}
  .qcard.approved{opacity:.72}
  .qtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .qtitle{font-size:1rem;font-weight:800}
  .qpts{color:var(--gold);font-weight:800;font-size:.9rem;white-space:nowrap}
  .qdesc{color:var(--muted);font-size:.82rem;margin:4px 0 0}
  .qmeta{margin:8px 0}
  .qdue{font-size:.76rem;font-weight:700;color:var(--muted)}
  .qdue.over{color:var(--bad)}
  .qdue.soon{color:var(--gold)}
  .qdue.wait{color:var(--gold)}
  .qdue.ok{color:var(--good)}
  .qbtn{width:auto;padding:10px 14px;font-size:.9rem}
  .qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
  .qrow .qbtn{flex:1}
  .btn.danger{color:var(--bad);border-color:#5a2020}
  textarea.inp{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:#fff;font-family:var(--font);font-size:1rem}
  label.lbl{display:flex;flex-direction:column;gap:4px;font-size:.74rem;color:var(--muted);font-weight:700}
  .datestep{display:flex;align-items:center;gap:8px}
  .datestep .arrow{width:44px;height:44px;border-radius:11px;background:var(--surface);border:1px solid var(--line);font-size:1.3rem;color:#fff;flex:none}
  .datemid{position:relative;flex:1;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:10px 6px}
  .datemid b{font-size:.95rem}.datemid .d{color:var(--muted);font-size:.82rem}
  .dateover{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:none;background:transparent}
  /* Lekser */
  .hwsec{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:16px 2px 8px;font-weight:800;display:flex;align-items:center;gap:6px}
  .hwseg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;margin:10px 0 4px}
  .hwseg .s{flex:1;text-align:center;padding:7px 2px;border-radius:8px;font-size:.78rem;font-weight:800;color:var(--muted);background:transparent;border:none;font-family:inherit;cursor:pointer}
  .hwseg .s.on{background:var(--accent);color:#fff}
  .hwcard{background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:9px}
  .hwcard.done{border-color:var(--gold)}
  .hwcard.approved{opacity:.6}
  .hwtop{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .hwsubj{font-weight:800;font-size:.95rem}
  .hwtext{color:var(--muted);font-size:.85rem;margin:5px 0 9px;line-height:1.4}
  .hwpts{flex:none;background:#152c1f;color:var(--good);border:1px solid var(--good);border-radius:10px;padding:2px 8px;font-weight:800;font-size:.78rem;white-space:nowrap}
  .weektag{font-size:.66rem;color:#c3b9ff;font-weight:800;background:#171438;border:1px solid #3a2f7a;border-radius:7px;padding:1px 6px;white-space:nowrap;margin-left:6px}
  .hwdaytag{font-size:.68rem;color:var(--muted);font-weight:700;background:var(--surface-2,#0f2547);border:1px solid var(--line);border-radius:7px;padding:1px 6px;margin-left:6px}
  .hwedited{font-size:.66rem;color:#c3b9ff;font-weight:800;background:#171438;border:1px solid #3a2f7a;border-radius:7px;padding:1px 6px}
  .hwsubjhead{display:flex;align-items:center;gap:7px;margin:14px 2px 7px;font-weight:800;font-size:.95rem}
</style>
</head>
<body>
  <div id="app"></div>
  <div id="appVersion"></div>
  <script>
    window.APP_VERSION = '2026.08.23 (b17 · Lekser)';
    window.EDGE_FUNCTION_URL = 'https://vkhktataxypuobrzslbi.supabase.co/functions/v1/clever-function';
  </script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
